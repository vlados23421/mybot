<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarWaves</title>
    <style>
        /* ===== Цвета Telegram ===== */
        :root {
            --bg-color: var(--tg-theme-bg-color, #0a0d14);
            --text-color: var(--tg-theme-text-color, #f0f6fc);
            --secondary-bg: var(--tg-theme-secondary-bg-color, rgba(22, 27, 34, 0.7));
            --accent: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        .header { text-align: center; padding: 20px 0; }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent), #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .header p { color: #8b949e; font-size: 14px; }

        .card {
            background: var(--secondary-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }

        .package-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .package-item:last-child { border-bottom: none; }
        .package-item .price { color: var(--accent); font-weight: 600; }

        .custom-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 16px;
            margin-top: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), #ff8c00);
            color: #0a0d14;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
            transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.02); }

        .footer { text-align: center; color: #8b949e; font-size: 12px; padding: 30px 0 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⭐ StarWaves</h1>
        <p>Магазин Telegram Stars</p>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 12px;">⭐ Популярные пакеты</h3>
        <div class="package-item"><span>50 звёзд</span><span class="price">1.0 TRX</span></div>
        <div class="package-item"><span>150 звёзд</span><span class="price">3.0 TRX</span></div>
        <div class="package-item"><span>300 звёзд</span><span class="price">5.0 TRX</span></div>
        <div class="package-item"><span>500 звёзд</span><span class="price">7.5 TRX</span></div>
        <div class="package-item"><span>1000 звёзд</span><span class="price">15.0 TRX</span></div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 12px;">✏️ Своё количество</h3>
        <input type="number" class="custom-input" id="customStars" placeholder="Введи количество звёзд..." min="1" max="10000">
        <div style="color: #8b949e; font-size: 14px; margin-top: 8px;">💰 Цена: <span id="customPrice" style="color: #ffd700;">0.00 TRX</span></div>
        <button class="btn" onclick="buyCustom()">🛒 Купить</button>
    </div>

    <div class="footer">StarWaves © 2026</div>

    <script>
        // Пересчёт цены при вводе
        document.getElementById('customStars').addEventListener('input', function() {
            const stars = parseInt(this.value) || 0;
            const price = (stars * 0.02).toFixed(2);
            document.getElementById('customPrice').textContent = `${price} TRX`;
        });

        // Кнопка покупки -> открывает бота
        function buyCustom() {
            const stars = document.getElementById('customStars').value;
            if (!stars || stars < 1) {
                alert('Введи количество звёзд!');
                return;
            }
            // Открываем бота с параметром
            window.location.href = `https://t.me/StarWavesBuyBot?start=buy_${stars}`;
        }

        // Для Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
